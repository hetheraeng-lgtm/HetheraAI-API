version: '3.8'
services:
  postgres:
    container_name: hethera-postgres
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: hethera
    volumes:
      - ../.db-volume:/var/lib/postgresql/data
    ports:
      - '5445:5432'
    networks:
      - hethera-postgres
    restart: unless-stopped

  redis:
    container_name: hethera-redis
    # redis-stack-server (not plain redis) — the chat agent's checkpoint saver
    # (langgraph-checkpoint-redis) indexes checkpoints with RediSearch, which
    # plain Redis doesn't ship.
    image: redis/redis-stack-server:latest
    volumes:
      - ../.redis-volume:/data
    ports:
      - '6380:6379'
    networks:
      - hethera-postgres
    restart: unless-stopped

networks:
  hethera-postgres:
    driver: bridge
